version: "3.8"

# ─────────────────────────────────────────────────────────
# Base: SmartMeal AI Container Orchestration
# ─────────────────────────────────────────────────────────
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: myfridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-myfridge_db}
      POSTGRES_USER: ${DB_USER:-myfridge_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-myfridge_secure_password_2026}
      TZ: ${TIMEZONE:-Asia/Ho_Chi_Minh}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myfridge_user} -d ${DB_NAME:-myfridge_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [myfridge-net]

  redis:
    image: redis:7.2-alpine
    container_name: myfridge-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-redis_secure_password_2026}"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD:-redis_secure_password_2026} ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [myfridge-net]

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: myfridge-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword2026}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [myfridge-net]

  ai-service:
    build:
      context: ./ai-service-fastapi
      dockerfile: Dockerfile
    container_name: myfridge-ai-service
    restart: unless-stopped
    environment:
      YOLO_MODEL_PATH: ${YOLO_MODEL_PATH:-/app/weights/yolov8n_food.pt}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-sentence-transformers/all-MiniLM-L6-v2}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-384}
      FASTAPI_WORKERS: ${FASTAPI_WORKERS:-2}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [myfridge-net]

  backend:
    build:
      context: ./backend-node-ts
      dockerfile: Dockerfile
    container_name: myfridge-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      SERVER_PORT: ${SERVER_PORT:-3000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-myfridge_db}
      DB_USER: ${DB_USER:-myfridge_user}
      DB_PASSWORD: ${DB_PASSWORD:-myfridge_secure_password_2026}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_secure_password_2026}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-miniopassword2026}
      AI_SERVICE_URL: http://ai-service:8000
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
      ai-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [myfridge-net]

  nginx:
    image: nginx:1.27-alpine
    container_name: myfridge-nginx
    restart: unless-stopped
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:    { condition: service_healthy }
      ai-service: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [myfridge-net]

networks:
  myfridge-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
