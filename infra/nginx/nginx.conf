# ─────────────────────────────────────────────────────────
# Nginx Reverse Proxy — SmartMeal AI
# client_max_body_size 10M (ingredient / pantry detection images)
# Extended proxy timeouts for YOLO inference and Gemini generation
# ─────────────────────────────────────────────────────────
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;

    log_format main '$remote_addr [$time_local] "$request" '
                    '$status $body_bytes_sent rt=$request_time '
                    'req_id="$http_x_request_id"';
    access_log /var/log/nginx/access.log main;

    upstream backend_upstream {
        server backend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream minio_upstream {
        server minio:9000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP → HTTPS redirect
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location / { return 301 https://$host$request_uri; }
    }

    # HTTPS main server
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "healthy\n";
        }

        location /media/ {
            proxy_pass http://minio_upstream/;
            proxy_set_header Host $http_host;
            proxy_connect_timeout 30s;
            proxy_read_timeout 60s;
        }

        location / {
            proxy_pass http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 60s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
        }
    }
}
