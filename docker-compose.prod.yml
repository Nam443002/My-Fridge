version: "3.8"

# ─────────────────────────────────────────────────────────
# Production / Staging — resource limits + logging
# ─────────────────────────────────────────────────────────
services:
  postgres:
    restart: always
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }
        reservations: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  redis:
    restart: always
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { cpus: "0.2", memory: 128M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  minio:
    restart: always
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1024M }
        reservations: { cpus: "0.25", memory: 256M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  ai-service:
    restart: always
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }
        reservations: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  backend:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2048M }
        reservations: { cpus: "0.5", memory: 512M }
    logging:
      driver: json-file
      options: { max-size: "50m", max-file: "7" }

  nginx:
    restart: always
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 256M }
        reservations: { cpus: "0.1", memory: 64M }
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
